# S5145: Log injection - false positive, using SanitizeForLog() sanitizer
sonar.issue.ignore.multicriteria.e1.ruleKey=roslyn.sonaranalyzer.security.cs:S5145
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs
