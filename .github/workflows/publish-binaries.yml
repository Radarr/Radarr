name: Publish Release Binaries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: master
  workflow_call:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        type: string
        default: master
      fork_tag:
        type: string
        required: false

env:
  INNOVERSION: 6.7.2

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          TAG="${{ inputs.fork_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")
          fi
          FORK_VERSION="${TAG#v}"
          UPSTREAM_VERSION="${FORK_VERSION%%-*}"

          echo "FORK_TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "FORK_VERSION=$FORK_VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "MAJORVERSION=${UPSTREAM_VERSION%.*}" >> "$GITHUB_ENV"
          echo "MINORVERSION=${UPSTREAM_VERSION##*.}" >> "$GITHUB_ENV"

      - name: Extract Target Framework
        shell: bash
        run: |
          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"

      - name: Set up Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build All Packages + Windows Installer
        shell: bash
        run: ./build.sh --backend --frontend --packages --installer -f "${{ env.FRAMEWORK }}"
        env:
          RADARRVERSION: ${{ steps.get_version.outputs.UPSTREAM_VERSION }}
          BRANCH: ${{ inputs.branch }}
          BUILD_SOURCEBRANCHNAME: ${{ inputs.branch }}

      - name: Install zip tool
        shell: cmd
        run: choco install zip -y

      - name: Package Archives (.tar.gz / .zip / .exe)
        shell: bash
        run: .github/actions/package/package.sh
        env:
          FRAMEWORK: ${{ env.FRAMEWORK }}
          BRANCH: ${{ inputs.branch }}
          RADARRVERSION: ${{ steps.get_version.outputs.FORK_VERSION }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.FORK_TAG }}
          name: Radarr v${{ steps.get_version.outputs.FORK_VERSION }}
          body: |
            Based on upstream Radarr [v${{ steps.get_version.outputs.UPSTREAM_VERSION }}](https://github.com/Radarr/Radarr/releases/tag/v${{ steps.get_version.outputs.UPSTREAM_VERSION }}).
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            _artifacts/*.tar.gz
            _artifacts/*.zip
            _artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
