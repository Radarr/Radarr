name: Push Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: master
  workflow_call:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        type: string
        default: master
      fork_version:
        type: string
        required: false
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  docker:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
      statuses: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Extract Metadata & Determine Mode
        id: meta_env
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IS_PR="true"
            PR_SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            BRANCH="${BRANCH//\//-}"

            echo "IS_PR=$IS_PR" >> "$GITHUB_ENV"
            echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

            PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ -z "$PR_NUM" ]; then
              PR_NUM=$(gh pr list --repo "${{ github.repository }}" --search "$PR_SHA" --json number --jq '.[0].number // empty' | head -n 1)
            fi

            if [ -z "$PR_NUM" ]; then
              echo "::error::Could not resolve PR number for commit $PR_SHA"
              exit 1
            fi
            echo "PR_NUM=$PR_NUM" >> "$GITHUB_OUTPUT"

            if [ -n "$PR_SHA" ]; then
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository }}/statuses/$PR_SHA \
                -f state='pending' \
                -f description='Building & pushing PR Docker image...' \
                -f context='(Docker) Push PR Image' \
                -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            fi

            if ! git fetch origin "pull/$PR_NUM/merge:pr-$PR_NUM-merge" || ! git checkout "pr-$PR_NUM-merge"; then
              echo "::error::Failed to checkout pull/$PR_NUM/merge. The PR likely has merge conflicts with the target branch."
              exit 1
            fi
          else
            IS_PR="false"
            PR_NUM=""
            PR_SHA=""
            BRANCH="${{ inputs.branch }}"
            BRANCH="${BRANCH//\//-}"
            echo "IS_PR=$IS_PR" >> "$GITHUB_ENV"
            echo "PR_NUM=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          fi

          FORK_VERSION="${{ inputs.fork_version }}"
          if [ -z "$FORK_VERSION" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")
            FORK_VERSION="${TAG#v}"
          fi
          UPSTREAM_VERSION="${FORK_VERSION%%-*}"

          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')

          echo "FORK_VERSION=$FORK_VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"

      - name: Set up Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compile Backend & Frontend Packages
        run: |
          ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-x64

          if [ "${{ env.IS_PR }}" != "true" ]; then
            ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-arm64
          else
            mkdir -p _artifacts/linux-musl-arm64/${{ env.FRAMEWORK }}/Radarr
          fi
        env:
          RADARRVERSION: ${{ steps.meta_env.outputs.UPSTREAM_VERSION }}
          BRANCH: ${{ env.BRANCH }}
          BUILD_SOURCEBRANCHNAME: ${{ env.BRANCH }}

      - name: Set Build Date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ steps.meta_env.outputs.PR_NUM }},enable=${{ env.IS_PR == 'true' }}
            type=raw,value=${{ steps.meta_env.outputs.FORK_VERSION }},enable=${{ env.IS_PR != 'true' }}
            type=raw,value=latest,enable=${{ env.IS_PR != 'true' && env.BRANCH == 'master' }}
            type=raw,value=${{ env.BRANCH }},enable=${{ env.IS_PR != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.IS_PR == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ steps.meta_env.outputs.UPSTREAM_VERSION }}
            RADARR_BRANCH=${{ env.BRANCH }}
            PACKAGE_AUTHOR=github.com/${{ github.repository }}

      - name: Update PR Status (Success)
        if: success() && env.IS_PR == 'true' && env.PR_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ env.PR_SHA }} \
            -f state='success' \
            -f description="Pushed ghcr.io/${{ github.repository }}:pr-${{ steps.meta_env.outputs.PR_NUM }}" \
            -f context='(Docker) Push PR Image' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}" || true

      - name: Update PR Status (Failure)
        if: failure() && env.IS_PR == 'true' && env.PR_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/statuses/${{ env.PR_SHA }} \
            -f state='failure' \
            -f description="Docker build/push failed" \
            -f context='(Docker) Push PR Image' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
