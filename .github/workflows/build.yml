name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "src/Radarr.Api.*/openapi.json"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "src/NzbDrone.Core/Localization/Core/**"
      - "src/Radarr.Api.*/openapi.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.variables.outputs.branch }}
      version: ${{ steps.variables.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Setup Variables
        id: variables
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 --exclude "*-*" 2>/dev/null || echo "v0.0.0.0")
          RADARR_VERSION="${TAG#v}"
          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')
          echo "RADARR_VERSION=$RADARR_VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_ENV"
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "branch=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "version=$RADARR_VERSION" >> "$GITHUB_OUTPUT"
          echo "framework=$FRAMEWORK" >> "$GITHUB_OUTPUT"

      - name: Build UI & Backend (linux-x64)
        run: ./build.sh --backend --frontend --lint --packages -f "${{ env.FRAMEWORK }}" -r linux-x64
        env:
          RADARRVERSION: ${{ env.RADARR_VERSION }}
          BRANCH: ${{ env.BRANCH }}
          BUILD_SOURCEBRANCHNAME: ${{ env.BRANCH }}

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build_ui
          path: _output/UI/**/*

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build_linux
          path: _artifacts/linux-*/**/*

      - name: Publish linux-x64 Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux-x64
          path: _tests/${{ env.FRAMEWORK }}/linux-x64/publish/**/*

  unit_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Test Artifact
        uses: actions/download-artifact@v4
        with:
          name: tests-linux-x64
          path: _tests

      - name: Make Test Binaries Executable
        shell: bash
        run: |
          chmod +x _tests/ffprobe
          find _tests -name "Radarr.Test.Dummy" -exec chmod +x {} \;
          chmod +x _tests/test.sh

      - name: Run Unit Tests
        shell: bash
        env:
          TEST_DIR: ${{ github.workspace }}/_tests
        run: _tests/test.sh Linux Unit Test

      - name: Upload Unit Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-unit-linux
          path: TestResult.xml

      - name: Publish Unit Test Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Summary
          path: TestResult.xml
          reporter: dotnet-nunit

  unit_test_postgres:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: radarr
          POSTGRES_USER: radarr
          POSTGRES_DB: radarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U radarr" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      Radarr__Postgres__Host: localhost
      Radarr__Postgres__Port: 5432
      Radarr__Postgres__User: radarr
      Radarr__Postgres__Password: radarr
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Test Artifact
        uses: actions/download-artifact@v4
        with:
          name: tests-linux-x64
          path: _tests

      - name: Make Test Binaries Executable
        shell: bash
        run: |
          chmod +x _tests/ffprobe
          find _tests -name "Radarr.Test.Dummy" -exec chmod +x {} \;
          chmod +x _tests/test.sh

      - name: Run Unit Tests (Postgres)
        shell: bash
        env:
          TEST_DIR: ${{ github.workspace }}/_tests
        run: _tests/test.sh Linux Unit Test

      - name: Upload Unit Test Results (Postgres)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-unit-linux-postgres-${{ matrix.postgres }}
          path: TestResult.xml

      - name: Publish Unit Test (Postgres) Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test (Postgres ${{ matrix.postgres }}) Summary
          path: TestResult.xml
          reporter: dotnet-nunit

  integration_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Test Artifact
        uses: actions/download-artifact@v4
        with:
          name: tests-linux-x64
          path: _tests

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build_linux
          path: _output

      - name: Prepare Binary Directory
        shell: bash
        run: |
          mkdir -p ./bin
          mkdir -p _tests/bin
          find _output -name "Radarr.dll" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/. ./bin/
          cp -r ./bin/. _tests/bin/

      - name: Make Test Binaries Executable
        shell: bash
        run: |
          chmod +x _tests/ffprobe 2>/dev/null || true
          find _tests -name "Radarr.Test.Dummy" -exec chmod +x {} \;
          chmod +x _tests/test.sh
          chmod +x ./bin/Radarr 2>/dev/null || true
          chmod +x _tests/bin/Radarr 2>/dev/null || true

      - name: Run Integration Tests
        shell: bash
        env:
          TEST_DIR: ${{ github.workspace }}/_tests
        run: _tests/test.sh Linux Integration Test

      - name: Upload Integration Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-integration-linux
          path: TestResult.xml

      - name: Publish Integration Test Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Summary
          path: TestResult.xml
