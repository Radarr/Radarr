          chmod +x _tests/test.sh
          chmod +x ./bin/Radarr 2>/dev/null || true
          chmod +x _tests/bin/Radarr 2>/dev/null || true

      - name: Run Integration Tests (Postgres)
        shell: bash
        env:
          TEST_DIR: ${{ github.workspace }}/_tests
        run: _tests/test.sh Linux Integration Test

      - name: Upload Integration Test Results (Postgres)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-integration-linux-postgres-${{ matrix.postgres }}
          path: TestResult.xml

      - name: Publish Integration Test (Postgres) Summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test (Postgres ${{ matrix.postgres }}) Summary
          path: TestResult.xml
          reporter: dotnet-nunit

  automation_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Test Artifact
        uses: actions/download-artifact@v4
        with:
